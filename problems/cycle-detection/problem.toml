schemaVersion = 1
draft = false
name = "cp-library-cycle-detection"
description = "Detect whether an undirected graph is a forest or return a simple cycle."
created = "2026-09-30"
tags = ["graphs", "dfs", "cycles"]

[info]
inputFile = "stdin"
outputFile = "stdout"
interactive = false
wellFormed = true
skipDuplicatedTestsValidation = false
timeLimit = 1000
memoryLimit = 256

[statements.english]
encoding = "UTF-8"
name = "Cycle Detection"
legend = "statements/english/legend.tex"
input = "statements/english/input.tex"
output = "statements/english/output.tex"
notes = "statements/english/notes.tex"
tutorial = "statements/english/tutorial.tex"

[[files]]
type = "resource"
name = "testlib.h"
path = "../../include/testlib.h"

[[files]]
type = "resource"
name = "testlib_ext.h"
path = "../../include/testlib_ext.h"

[[files]]
type = "source"
name = "gen.cpp"
path = "generators/gen.cpp"
sourceType = "cpp.g++17"

[[files]]
type = "source"
name = "validator.cpp"
path = "validators/validator.cpp"
sourceType = "cpp.g++17"

[[files]]
type = "source"
name = "checker.cpp"
path = "checkers/checker.cpp"
sourceType = "cpp.g++17"

[assets]
validator = "validator.cpp"
checker = "checker.cpp"

[[solutions]]
name = "main.cpp"
path = "solutions/main.cpp"
tag = "MA"
sourceType = "cpp.g++17"

[[solutions]]
name = "reference.cpp"
path = "solutions/reference.cpp"
tag = "OK"
sourceType = "cpp.g++17"

[[solutions]]
name = "wrong.cpp"
path = "solutions/wrong.cpp"
tag = "WA"
sourceType = "cpp.g++17"

[testsets.tests]
script = "tests/doall.txt"

[[testsets.tests.manualTests]]
index = 1
input = "tests/manual/01.in"
output = "tests/manual/01.ans"
useInStatements = true
description = "A graph with a cycle and a separate tree component"

[[testsets.tests.manualTests]]
index = 2
input = "tests/manual/02.in"
output = "tests/manual/02.ans"
useInStatements = true
description = "A disconnected forest"

[selfTests]
validator = "tests/validator/cases.json"
checker = "tests/checker/cases.json"

[verification]
oracle = "solutions/oracle.py"
stressGenerator = "tests/stress.py"
